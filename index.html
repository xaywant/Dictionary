<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Dictionary</title>
<style>
  :root {
    --bg:#f2f5f7; --surface:#fff; --ink:#1b2740; --muted:#5d6b82; --line:#d9e0e8;
    --accent:#0e7c86; --on-accent:#fff; --chip:#e4f1f2;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#10161f; --surface:#172030; --ink:#e8edf5; --muted:#98a6bb; --line:#27344a;
    --accent:#4fc3cd; --on-accent:#0b1a1c; --chip:#1c3238;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); display:flex; flex-direction:column; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }

  .view { flex:1; overflow-y:auto; padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px; width:100%; max-width:560px; margin:0 auto; }
  h1 { font:600 1.5rem var(--serif); margin:0 0 16px; }
  h2.sub { font:600 .9rem var(--sans); color:var(--muted); margin:24px 0 8px; }

  form { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; font:inherit; font-size:1.05rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .go { background:var(--accent); color:var(--on-accent); border:0; border-radius:12px; padding:0 20px; font-weight:600; }

  .card { margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 20px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .word { font:600 2.4rem/1.1 var(--serif); margin:0; word-break:break-word; }
  .meta { display:flex; align-items:center; gap:10px; margin-top:8px; color:var(--muted); }
  .icon-btn { border:1px solid var(--line); background:none; border-radius:999px; width:40px; height:40px; display:grid; place-items:center; color:var(--accent); flex:none; }
  .icon-btn svg { width:20px; height:20px; }
  .icon-btn.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .pos { font:italic 600 1.05rem var(--serif); color:var(--accent); margin:22px 0 6px; }
  ol { margin:0; padding-left:1.4rem; }
  li { font:400 1.15rem/1.5 var(--serif); margin-bottom:10px; padding-left:4px; }
  .ex { display:block; font-style:italic; color:var(--muted); font-size:1rem; margin-top:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--chip); border:0; border-radius:999px; padding:7px 14px; font-size:.95rem; }
  .msg { color:var(--muted); line-height:1.5; margin-top:20px; }

  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px; }
  .row.tap { width:100%; text-align:left; }
  .row .l { display:flex; flex-direction:column; gap:2px; }
  .row small { color:var(--muted); }
  select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .switch { width:48px; height:28px; border-radius:999px; background:var(--line); border:0; position:relative; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch[aria-checked="true"] { background:var(--accent); }
  .switch[aria-checked="true"]::after { transform:translateX(20px); }
  .danger { color:#c0392b; }

  nav { display:flex; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav button { flex:1; background:none; border:0; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:.75rem; }
  nav button svg { width:24px; height:24px; }
  nav button[aria-current="page"] { color:var(--accent); font-weight:600; }
  @media (prefers-reduced-motion: reduce) { .switch::after { transition:none; } }
</style>
</head>
<body>

<!-- SEARCH -->
<main class="view" id="v-search">
  <h1>Dictionary</h1>
  <form id="form" autocomplete="off">
    <input id="q" type="text" placeholder="Search a word" aria-label="Word to look up" autocapitalize="none" spellcheck="false" enterkeyhint="search">
    <button class="go" type="submit">Define</button>
  </form>
  <div id="out"><p class="msg">Type a word to see its meanings, synonyms and antonyms.</p></div>
</main>

<!-- SAVED -->
<main class="view" id="v-saved" hidden>
  <h1>Saved</h1>
  <div id="favs"></div>
  <h2 class="sub">Recent searches</h2>
  <div id="hist"></div>
  <button class="row tap danger" id="clearHist"><span>Clear recent searches</span></button>
</main>

<!-- SETTINGS -->
<main class="view" id="v-settings" hidden>
  <h1>Settings</h1>
  <div class="row"><div class="l"><span>Theme</span></div>
    <select id="s-theme" aria-label="Theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="row"><div class="l"><span>Text size</span></div>
    <select id="s-size" aria-label="Text size"><option value="100">Normal</option><option value="115">Large</option><option value="130">Extra large</option></select></div>
  <div class="row"><div class="l"><span>Definitions per meaning</span><small>How many to show for each part of speech</small></div>
    <select id="s-defs" aria-label="Definitions per meaning"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>
  <div class="row"><span>Show examples</span><button class="switch" role="switch" id="s-ex" aria-label="Show examples"></button></div>
  <div class="row"><span>Show synonyms and antonyms</span><button class="switch" role="switch" id="s-syn" aria-label="Show synonyms and antonyms"></button></div>
  <button class="row tap danger" id="clearAll"><span>Erase saved words and cache</span></button>
  <p class="msg">Definitions from dictionaryapi.dev. Related words from Datamuse.</p>
</main>

<nav aria-label="Main">
  <button data-tab="search" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
  <button data-tab="saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>

<script>
const DICT = "https://api.dictionaryapi.dev/api/v2/entries/en/";
const MUSE = "https://api.datamuse.com/words?max=8&";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- settings ---------- */
const defaults = { theme:"auto", size:"100", defs:"3", examples:true, syn:true };
let settings = { ...defaults, ...store.get("dictionary-settings", {}) };
const dark = matchMedia("(prefers-color-scheme: dark)");

function applySettings() {
  const t = settings.theme === "auto" ? (dark.matches ? "dark" : "light") : settings.theme;
  document.documentElement.dataset.theme = t;
  document.documentElement.style.fontSize = settings.size + "%";
  document.querySelector('meta[name=theme-color]').content = t === "dark" ? "#172030" : "#0e7c86";
  $("s-theme").value = settings.theme; $("s-size").value = settings.size; $("s-defs").value = settings.defs;
  $("s-ex").setAttribute("aria-checked", settings.examples); $("s-syn").setAttribute("aria-checked", settings.syn);
}
function saveSettings() { store.set("dictionary-settings", settings); applySettings(); if (current) paint(); }
dark.addEventListener("change", applySettings);
$("s-theme").onchange = e => { settings.theme = e.target.value; saveSettings(); };
$("s-size").onchange = e => { settings.size = e.target.value; saveSettings(); };
$("s-defs").onchange = e => { settings.defs = e.target.value; saveSettings(); };
$("s-ex").onclick = () => { settings.examples = !settings.examples; saveSettings(); };
$("s-syn").onclick = () => { settings.syn = !settings.syn; saveSettings(); };

/* ---------- tabs ---------- */
function show(tab) {
  for (const t of ["search","saved","settings"]) $("v-" + t).hidden = t !== tab;
  document.querySelectorAll("nav button").forEach(b => b.toggleAttribute("aria-current", b.dataset.tab === tab));
  document.querySelectorAll("nav button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (tab === "saved") renderSaved();
}
document.querySelector("nav").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); };

/* ---------- data ---------- */
async function fetchWord(word) {
  const cache = store.get("dictionary-cache", {});
  if (cache[word]) return cache[word];
  const res = await fetch(DICT + encodeURIComponent(word));
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("service");
  const entry = (await res.json())[0];
  const meanings = entry.meanings.filter(m => m.definitions?.length).map(m => ({
    pos: m.partOfSpeech,
    defs: m.definitions.slice(0, 6).map(d => ({ d: d.definition, ex: d.example || "" })),
    syn: [...(m.synonyms||[]), ...m.definitions.flatMap(d => d.synonyms||[])],
    ant: [...(m.antonyms||[]), ...m.definitions.flatMap(d => d.antonyms||[])]
  }));
  const result = {
    word: entry.word,
    phonetic: entry.phonetic || entry.phonetics?.map(p => p.text).find(Boolean) || "",
    audio: entry.phonetics?.map(p => p.audio).find(Boolean) || "",
    meanings
  };
  cache[word] = result;
  // keep the cache from growing forever
  const keys = Object.keys(cache); if (keys.length > 150) delete cache[keys[0]];
  store.set("dictionary-cache", cache);
  return result;
}
async function related(type, word) {
  try { return (await (await fetch(`${MUSE}rel_${type}=${encodeURIComponent(word)}`)).json()).map(w => w.word); }
  catch { return []; }
}

/* ---------- search view ---------- */
let current = null, rel = { syn:[], ant:[] };
const uniq = a => [...new Set(a)].slice(0, 8);
const chips = l => l.map(w => `<button class="chip" data-word="${esc(w)}">${esc(w)}</button>`).join("");
const isFav = w => store.get("dictionary-favs", []).includes(w);

function paint() {
  if (!current) return;
  const e = current, n = +settings.defs;
  const syn = uniq([...e.meanings.flatMap(m => m.syn), ...rel.syn]);
  const ant = uniq([...e.meanings.flatMap(m => m.ant), ...rel.ant]);
  const star = isFav(e.word.toLowerCase());
  $("out").innerHTML = `<article class="card">
    <div class="top"><div>
      <h2 class="word">${esc(e.word)}</h2>
      <div class="meta">${e.phonetic ? `<span>${esc(e.phonetic)}</span>` : ""}</div></div>
      <div style="display:flex;gap:8px">
        ${e.audio ? `<button class="icon-btn" id="play" aria-label="Play pronunciation"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>` : ""}
        <button class="icon-btn ${star ? "on" : ""}" id="fav" aria-label="${star ? "Remove from saved" : "Save word"}" aria-pressed="${star}"><svg viewBox="0 0 24 24" fill="${star ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
      </div></div>
    ${e.meanings.map(m => `<div class="pos">${esc(m.pos)}</div><ol>${m.defs.slice(0, n).map(x =>
      `<li>${esc(x.d)}${settings.examples && x.ex ? `<span class="ex">“${esc(x.ex)}”</span>` : ""}</li>`).join("")}</ol>`).join("")}
    ${settings.syn && syn.length ? `<h2 class="sub">Synonyms</h2><div class="chips">${chips(syn)}</div>` : ""}
    ${settings.syn && ant.length ? `<h2 class="sub">Antonyms</h2><div class="chips">${chips(ant)}</div>` : ""}
  </article>`;
}

async function lookup(raw) {
  const word = raw.trim().toLowerCase();
  show("search");
  if (!word) return;
  if (!/^[a-z'-]+$/.test(word)) { $("out").innerHTML = `<p class="msg">Enter a single English word using letters only.</p>`; return; }
  $("q").value = word;
  $("out").innerHTML = `<p class="msg">Looking up…</p>`;
  try {
    const entry = await fetchWord(word);
    if (!entry || !entry.meanings.length) { $("out").innerHTML = `<p class="msg">No definition found for “${esc(word)}”. Check the spelling and try again.</p>`; return; }
    current = entry; rel = { syn:[], ant:[] };
    const h = store.get("dictionary-hist", []).filter(w => w !== word); h.unshift(word); store.set("dictionary-hist", h.slice(0, 30));
    paint();
    const needS = !entry.meanings.some(m => m.syn.length), needA = !entry.meanings.some(m => m.ant.length);
    if (settings.syn && (needS || needA)) {
      const [s, a] = await Promise.all([needS ? related("syn", word) : [], needA ? related("ant", word) : []]);
      if (current === entry) { rel = { syn:s, ant:a }; paint(); }
    }
  } catch { $("out").innerHTML = `<p class="msg">Couldn’t reach the dictionary. Check your connection and try again.</p>`; }
}

$("form").onsubmit = e => { e.preventDefault(); $("q").blur(); lookup($("q").value); };

/* ---------- saved view ---------- */
function list(words, empty) {
  return words.length ? words.map(w => `<button class="row tap" data-word="${esc(w)}"><span>${esc(w)}</span></button>`).join("") : `<p class="msg">${empty}</p>`;
}
function renderSaved() {
  $("favs").innerHTML = list(store.get("dictionary-favs", []), "No saved words yet. Tap the bookmark on a word to save it.");
  const h = store.get("dictionary-hist", []);
  $("hist").innerHTML = list(h, "Words you search will appear here.");
  $("clearHist").hidden = !h.length;
}
$("clearHist").onclick = () => { store.set("dictionary-hist", []); renderSaved(); };
$("clearAll").onclick = () => {
  if (!confirm("Erase saved words, recent searches and cached definitions?")) return;
  ["dictionary-favs","dictionary-hist","dictionary-cache"].forEach(k => store.set(k, k === "dictionary-cache" ? {} : []));
  current = null; $("out").innerHTML = `<p class="msg">Type a word to see its meanings, synonyms and antonyms.</p>`; renderSaved();
};

/* ---------- global clicks ---------- */
document.addEventListener("click", e => {
  const w = e.target.closest("[data-word]");
  if (w) return lookup(w.dataset.word);
  if (e.target.closest("#play") && current?.audio) new Audio(current.audio).play().catch(() => {});
  if (e.target.closest("#fav") && current) {
    const k = current.word.toLowerCase(); let f = store.get("dictionary-favs", []);
    f = f.includes(k) ? f.filter(x => x !== k) : [k, ...f]; store.set("dictionary-favs", f); paint();
  }
});

applySettings();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
